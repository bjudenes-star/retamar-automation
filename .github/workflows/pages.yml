name: Deploy GitHub Pages

# Publica la carpeta tools/ en GitHub Pages en cada push a main.
# La herramienta queda en: https://bjudenes-star.github.io/retamar-automation/devoluciones-manolo/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue a la vez; no cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (solo la carpeta tools/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
