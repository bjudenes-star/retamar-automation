<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{
    --bg:#eef2f9; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#e6ecf5;
    --brand:#1d4ed8; --brand2:#0ea5e9; --brandink:#1e3a8a;
    --green:#16a34a; --amber:#f59e0b; --red:#dc2626; --violet:#7c3aed; --slate:#64748b;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:var(--brand);text-decoration:none}
  /* ---- layout ---- */
  .app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:60px 1fr;
    grid-template-areas:"side top" "side main";height:100vh}
  .topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 22px;
    background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .side{grid-area:side;background:linear-gradient(180deg,#15225a,#1e3a8a);color:#fff;
    padding:18px 14px;display:flex;flex-direction:column;gap:4px}
  .main{grid-area:main;overflow:auto;padding:22px 26px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 6px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--brandink);
    display:grid;place-items:center;font-weight:900;font-size:16px}
  .brand b{font-size:15px;line-height:1.1}.brand span{font-size:11px;color:#a9b6e6;display:block}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
    color:#cdd7f5;font-weight:600;font-size:13.5px;width:100%;text-align:left}
  .nav button .ic{width:20px;text-align:center;font-size:15px}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.on{background:#fff;color:var(--brandink)}
  .side .foot{margin-top:auto;font-size:11px;color:#8ea0da;padding:10px 8px;line-height:1.5}
  /* ---- topbar widgets ---- */
  .crumb{font-weight:700;font-size:16px}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:#f1f5fb;border:1px solid var(--line);
    border-radius:10px;padding:7px 12px;min-width:240px}
  .search input{border:0;background:none;outline:none;font:inherit;width:100%}
  .pill{display:flex;align-items:center;gap:8px;background:#f1f5fb;border:1px solid var(--line);
    border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
  .pill select{border:0;background:none;outline:none;font:inherit;font-weight:700;color:var(--brandink)}
  .switch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
  .switch .track{width:38px;height:22px;border-radius:999px;background:#cbd5e1;position:relative;transition:.2s}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.on .track{background:var(--green)}.switch.on .track::after{left:18px}
  /* ---- cards / grid ---- */
  .row{display:grid;gap:14px;margin-bottom:14px}
  .g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
  .c2-3{grid-template-columns:1.4fr 1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow)}
  .card h3{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .kpi .ic{font-size:20px}.kpi .v{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi .sub{font-size:11px;color:#94a3b8;font-weight:600}
  .kpi.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}
  .kpi.hero .l,.kpi.hero .sub{color:rgba(255,255,255,.85)}
  .delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#e8f5ee;color:var(--green)}
  /* ---- bars / funnel ---- */
  .bar{display:grid;grid-template-columns:160px 1fr 38px;align-items:center;gap:10px;margin:9px 0}
  .bar .lb{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .tk{background:#eef2f8;border-radius:7px;height:18px;overflow:hidden}
  .bar .fl{height:100%;border-radius:7px;transition:width .5s ease}
  .bar .vl{font-size:12.5px;font-weight:800;text-align:right;color:var(--muted)}
  .funnel .fb{display:flex;align-items:center;gap:10px;margin:8px 0}
  .funnel .fb .seg{height:34px;border-radius:9px;display:flex;align-items:center;padding:0 12px;color:#fff;
    font-weight:700;font-size:13px;min-width:64px;transition:width .5s ease;box-shadow:var(--shadow)}
  .funnel .fb .nm{font-size:12.5px;color:var(--muted);width:170px;flex:none}
  /* ---- donut ---- */
  .donut-wrap{display:flex;align-items:center;gap:20px}
  .donut{width:150px;height:150px;border-radius:50%;flex:none;position:relative}
  .donut .hole{position:absolute;inset:26px;background:var(--panel);border-radius:50%;display:grid;place-items:center;text-align:center}
  .donut .hole b{font-size:24px}.donut .hole span{font-size:10px;color:var(--muted);display:block}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;flex:1}
  .legend .it{display:flex;align-items:center;gap:8px}
  .legend .dot{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .it b{margin-left:auto}
  /* ---- tabla pipeline ---- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .chipf{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted)}
  .chipf.on{background:var(--brandink);color:#fff;border-color:var(--brandink)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  thead th{background:#f8fafc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tbody tr:hover{background:#f8fbff}tbody tr:last-child td{border-bottom:0}
  .nm-cell b{font-weight:700}.nm-cell small{color:var(--muted);display:block;font-size:11px}
  .badge{font-size:10.5px;font-weight:800;color:#fff;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef2f8;color:#475569}
  .scorepill{font-weight:800;font-size:12px;color:var(--brand)}
  .iconbtns{display:flex;gap:5px}
  .ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px;transition:.12s}
  .ib:hover{background:#eef4ff;border-color:#c7d8fb;transform:translateY(-1px)}
  .ib:active{transform:scale(.94)}
  /* ---- kanban ---- */
  .kan{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
  .kcol{background:#eff3fa;border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:160px}
  .kcol.drop{outline:2px dashed var(--brand);outline-offset:-4px;background:#e7eefc}
  .kcol .kh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;
    text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:4px 6px 10px}
  .kcol .kh .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
  .kcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--slate);border-radius:10px;
    padding:9px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.05);cursor:grab}
  .kcard:active{cursor:grabbing}
  .kcard .kn{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kcard .km{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
  /* ---- modal ficha ---- */
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
  .scrim.on{display:flex}
  .modal{background:var(--panel);width:760px;max-width:100%;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
  .modal .mh{padding:18px 22px;background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff;display:flex;align-items:flex-start;justify-content:space-between}
  .modal .mh h2{font-size:20px;font-weight:800}.modal .mh .x{font-size:22px;color:#fff;opacity:.8}
  .modal .mb{padding:20px 22px}
  .kvs{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-bottom:16px}
  .kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .kv .v{font-size:14px;font-weight:600}
  .obs{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:#334155;white-space:pre-wrap;margin-bottom:16px}
  .actbar{display:flex;flex-wrap:wrap;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-weight:700;font-size:13px;transition:.12s}
  .btn:hover{background:#f1f5ff;border-color:#c7d8fb}.btn:active{transform:scale(.97)}
  .btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.pri:hover{background:#1842c9}
  .btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.dng{background:#fff;color:var(--red);border-color:#f3c7c7}.btn.dng:hover{background:#fff0f0}
  .inlinepanel{background:#f7f9ff;border:1px dashed #c7d8fb;border-radius:10px;padding:12px;margin-top:12px;display:none;gap:8px;flex-wrap:wrap;align-items:center}
  .inlinepanel.on{display:flex}
  .inlinepanel input,.inlinepanel select,.inlinepanel textarea{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
  .inlinepanel textarea{width:100%;min-height:54px;resize:vertical}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;user-select:none}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* ---- toast ---- */
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);background:#0f172a;color:#fff;
    padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.28s;z-index:80;max-width:80%}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #toast.ok{background:#15803d}#toast.dng{background:#b91c1c}
  .empty{color:var(--muted);font-style:italic;padding:18px;text-align:center}
  .small{font-size:12px;color:var(--muted)}
  /* ---- correo ---- */
  .mailbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .mailhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800}
  .mailitem{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
  .mailitem:hover{background:#f8fbff}.mailitem:last-child{border-bottom:0}
  .mailitem.unread{background:#f4f8ff}
  .av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
  .mailitem .who{font-weight:700;font-size:13px;width:170px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mailitem .subj{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mailitem .subj span{color:var(--muted)}
  .mailitem .meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;flex:none}
  .draftlabel{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:6px;font-size:10.5px;font-weight:800;padding:1px 7px}
  .attach{background:#eef2f8;border:1px solid var(--line);border-radius:6px;font-size:11px;padding:2px 8px;color:#475569;font-weight:700;display:inline-flex;gap:5px;align-items:center}
  .mailbody{white-space:pre-wrap;font-size:14px;line-height:1.6;color:#1e293b;padding:6px 2px 16px}
  @media(max-width:1100px){.g5{grid-template-columns:repeat(2,1fr)}.kan{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:64px 1fr}.brand b,.brand span,.nav button span,.side .foot{display:none}}
</style>
</head>

/* ---------- estado global ---------- */
var VIEW='dashboard', CAMP='', Q='', PRES=true, FILTRO_ESTADO='', dragId=null, LEADSMODE='lista';

var mailSeq=0;
var DOSSIERES=[
  {id:'general',nombre:'Dossier general FP'},
  {id:'comercio',nombre:'Comercio y Marketing',familia:'Comercio y Marketing'},
  {id:'admin',nombre:'Administración y Gestión',familia:'Administración y Gestión'},

];

  'Solicitud - Reserva Plaza':'#f97316','Matriculado':'#16a34a','Descartado':'#dc2626','Lead Perdido':'#7c3aed'};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pct(x){return (Math.round(x*1000)/10)+'%';}
function maskMail(e){if(!e)return '—';if(!PRES)return e;var p=e.split('@');return p[0].slice(0,2)+'•••@'+(p[1]||'');}
function maskTel(t){if(!t)return '—';if(!PRES)return t;return t.slice(0,3)+' ••• '+t.slice(-2);}
function nombreVis(l){return l.nombre || maskMail(l.email) || '(sin datos)';}
function badge(e){return '<span class="badge" style="background:'+(COLOR[e]||'#94a3b8')+'">'+esc(e)+'</span>';}
function activo(l){return !/Matriculado|Descartado|Lead Perdido/.test(l.estado);}
function toast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='show '+(t||'');clearTimeout(el._t);el._t=setTimeout(function(){el.className='';},2800);}

/* ---------- correo (borradores que generan las acciones) ---------- */
function primerNombre(l){return (l.nombre||'').split(' ')[0]||'';}
function crearMail(l,asunto,cuerpo,adjuntos){
  MAILS.unshift({id:++mailSeq,para:l.email||'(sin email)',paraNombre:nombreVis(l),
    asunto:asunto,cuerpo:cuerpo,adjuntos:adjuntos||[],fecha:'ahora',leido:false});
  actualizarBadge();
}
function actualizarBadge(){var b=document.getElementById('mailcnt');var n=MAILS.filter(function(m){return !m.leido;}).length;
  if(n>0){b.textContent=n;b.style.display='inline-block';}else{b.style.display='none';}}
function seedCorreo(){
  // un par de borradores de ejemplo para que la bandeja no arranque vacía
  var a=LEADS.find(function(l){return l.estado==='Interesado - Entrevista';})||LEADS[0];
  crearMail(a,'Dossier informativo — FP Retamar',
    'Hola '+primerNombre(a)+',\n\nGracias por tu interés en la FP de Retamar. Te adjunto la información que pediste.\n\nUn saludo,\nAdmisiones FP — Retamar',
    ['Dossier general FP.pdf']);
}

function visibles(){
  return LEADS.filter(function(l){
    if(CAMP && l.campana!==CAMP) return false;
    if(Q){var s=(l.nombre+' '+l.email+' '+l.ciclo+' '+l.colegio).toLowerCase();if(s.indexOf(Q.toLowerCase())===-1)return false;}
    return true;
  });
}

/* ---------- KPIs ---------- */
function kpis(arr){
  var total=arr.length;
  var mat=arr.filter(function(l){return l.estado==='Matriculado';}).length;
  var directa=arr.filter(function(l){return l.estado==='Matriculado'&&l.directa;}).length;
  var perd=arr.filter(function(l){return l.estado==='Descartado'||l.estado==='Lead Perdido';}).length;
  var act=total-mat-perd;
  var leadsReales=total-directa, matCapt=mat-directa;
  var conv=leadsReales>0?matCapt/leadsReales:0;
  var sc=arr.filter(function(l){return l.score>0;});
  var scoreMedio=sc.length?Math.round(sc.reduce(function(a,b){return a+b.score;},0)/sc.length):0;
  return {total:total,mat:mat,directa:directa,act:act,leadsReales:leadsReales,matCapt:matCapt,conv:conv,scoreMedio:scoreMedio,perd:perd};
}
function conteo(arr,campo){var c={};arr.forEach(function(l){var v=l[campo]||'—';c[v]=(c[v]||0)+1;});return c;}

/* ---------- componentes ---------- */
function kpiCard(ic,v,l,sub,hero){
  return '<div class="card kpi'+(hero?' hero':'')+'"><div class="ic">'+ic+'</div>'+
    '<div class="v">'+v+'</div><div class="l">'+esc(l)+(sub?' <span class="sub">'+sub+'</span>':'')+'</div></div>';
}
function barList(obj,colorFn,orden){
  var items=Object.keys(obj).map(function(k){return {k:k,v:obj[k]};});
  if(orden) items.sort(function(a,b){return b.v-a.v;});
  var max=Math.max.apply(null,items.map(function(i){return i.v;}))||1;
  if(!items.length) return '<div class="empty">Sin datos</div>';
  return items.map(function(it,i){
    var c=typeof colorFn==='function'?colorFn(it.k,i):colorFn;
    return '<div class="bar"><div class="lb" title="'+esc(it.k)+'">'+esc(it.k)+'</div>'+
      '<div class="tk"><div class="fl" style="width:'+Math.round(it.v/max*100)+'%;background:'+c+'"></div></div>'+
      '<div class="vl">'+it.v+'</div></div>';
  }).join('');
}
function donut(obj){
  var items=Object.keys(obj).map(function(k,i){return {k:k,v:obj[k],c:PALETA[i%PALETA.length]};}).filter(function(x){return x.v>0;});
  var tot=items.reduce(function(a,b){return a+b.v;},0)||1,acc=0,segs=[];
  items.forEach(function(it){var f=acc/tot*100;acc+=it.v;segs.push(it.c+' '+f+'% '+(acc/tot*100)+'%');});
  var leg=items.map(function(it){return '<div class="it"><span class="dot" style="background:'+it.c+'"></span>'+esc(it.k)+' <b>'+it.v+'</b></div>';}).join('');
  return '<div class="donut-wrap"><div class="donut" style="background:conic-gradient('+segs.join(',')+')"><div class="hole"><b>'+tot+'</b><span>leads</span></div></div><div class="legend">'+leg+'</div></div>';
}

/* ---------- VISTA: Dashboard ---------- */
function renderDashboard(){
  var arr=visibles(), k=kpis(arr);
  var emb={}; EMBUDO.forEach(function(e){emb[e]=arr.filter(function(l){return l.estado===e;}).length;});
  var maxEmb=Math.max.apply(null,EMBUDO.map(function(e){return emb[e];}))||1;
  var canal=conteo(arr.filter(function(l){return l.canal;}),'canal');
  var ciclo=conteo(arr.filter(function(l){return l.ciclo;}),'ciclo');
  var fam=conteo(arr.filter(function(l){return l.familia;}),'familiaCorta');
  var porCamp={'2026-2027':0,'2025-2026':0}; arr.forEach(function(l){porCamp[l.campana]=(porCamp[l.campana]||0)+1;});

  var h='';
  h+='<div class="row g5">'+
    kpiCard('👥',k.leadsReales,'Leads de captación','',true)+
    kpiCard('🔥',k.act,'Activos en embudo')+
    kpiCard('🎓',k.matCapt,'Matrículas captadas')+
    kpiCard('📈',pct(k.conv),'Conversión captación')+
    kpiCard('⭐',k.scoreMedio,'Score medio')+'</div>';
  h+='<div class="row g3">'+
    kpiCard('🎯',k.mat,'Matrículas 1º (total)')+
    kpiCard('➡️',k.directa,'Directas (sin captación)','hermanos/coles')+
    kpiCard('🧊',k.perd,'Descartados / perdidos')+'</div>';

  // embudo
  var funnel='<div class="funnel">'+EMBUDO.map(function(e,i){
    var w=20+Math.round(emb[e]/maxEmb*80);
    return '<div class="fb"><div class="nm">'+esc(e)+'</div><div class="seg" style="width:'+w+'%;background:'+COLOR[e]+'">'+emb[e]+'</div></div>';
  }).join('')+'</div>';

  h+='<div class="row c2-3">'+
    '<div class="card"><h3>Embudo de captación</h3>'+funnel+'</div>'+
    '<div class="card"><h3>Leads por canal</h3>'+donut(canal)+'</div>'+'</div>';
  h+='<div class="row g2">'+
    '<div class="card"><h3>Ranking de ciclos</h3>'+barList(ciclo,'#1d4ed8',true)+'</div>'+
    '<div class="card"><h3>Por familia profesional</h3>'+barList(fam,'#14b8a6',true)+'</div>'+'</div>';
  h+='<div class="row g2">'+
    '<div class="card"><h3>Reparto por campaña</h3>'+barList(porCamp,function(k){return k==='2026-2027'?'#16a34a':'#94a3b8';})+
      '<div class="small" style="margin-top:8px">La campaña <b>2026-2027</b> (captación desde oct-2025) es la que se trabaja ahora.</div></div>'+
    '<div class="card"><h3>Leads recientes</h3>'+recientesHtml(arr)+'</div>'+'</div>';
  document.getElementById('view').innerHTML=h;
}
function recientesHtml(arr){
  var r=arr.slice().sort(function(a,b){return (b.fechaNum||0)-(a.fechaNum||0);}).slice(0,7);
  if(!r.length) return '<div class="empty">Sin leads</div>';
  return r.map(function(l){
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">'+
      '<div><b style="cursor:pointer" onclick="openFicha('+l.id+')">'+esc(nombreVis(l))+'</b><div class="small">'+esc(l.ciclo||'—')+' · '+esc(l.fecha||'')+'</div></div>'+
      badge(l.estado)+'</div>';
  }).join('');
}

/* ---------- VISTA: Leads (pipeline) ---------- */
function renderLeads(){
  var toggle='<div class="toolbar"><div class="pill" style="background:#fff">Vista '+
    '<button class="chipf'+(LEADSMODE==='lista'?' on':'')+'" onclick="setLeadsMode(\'lista\')">📋 Lista</button>'+
    '<button class="chipf'+(LEADSMODE==='kanban'?' on':'')+'" onclick="setLeadsMode(\'kanban\')">🗂️ Embudo</button></div>'+
    '<div class="grow"></div><button class="btn pri" onclick="nuevoLead()">➕ Nuevo lead</button></div>';
  if(LEADSMODE==='kanban'){document.getElementById('view').innerHTML=toggle+kanbanHtml();return;}
  var arr=visibles();
  if(FILTRO_ESTADO) arr=arr.filter(function(l){return FILTRO_ESTADO==='__act'?activo(l):l.estado===FILTRO_ESTADO;});
  var estados=['','__act','Nuevo','Contactado','Interesado - Entrevista','Solicitud - Reserva Plaza','Matriculado','Descartado'];
  var labels={'':'Todos','__act':'Solo activos'};
  var chips=estados.map(function(e){
    return '<button class="chipf'+(FILTRO_ESTADO===e?' on':'')+'" onclick="setFiltro(\''+e+'\')">'+(labels[e]||e)+'</button>';
  }).join('');
  var rows=arr.sort(function(a,b){return b.score-a.score;}).map(function(l){
    return '<tr>'+
      '<td class="nm-cell"><b style="cursor:pointer" onclick="openFicha('+l.id+')">'+esc(nombreVis(l))+'</b><small>'+esc(maskMail(l.email))+'</small></td>'+
      '<td>'+esc(l.ciclo||'—')+'</td>'+
      '<td>'+(l.nivel?'<span class="tag">'+l.nivel+'</span>':'')+'</td>'+
      '<td>'+badge(l.estado)+'</td>'+
      '<td><span class="scorepill">⭐ '+l.score+'</span></td>'+
      '<td><span class="tag">'+esc(l.campana)+'</span></td>'+
      '<td><div class="iconbtns">'+
        '<button class="ib" title="Registrar contacto" onclick="quick('+l.id+',\'Contactado\')">📞</button>'+
        '<button class="ib" title="Pasar a entrevista" onclick="quick('+l.id+',\'Interesado - Entrevista\')">📅</button>'+
        '<button class="ib" title="Matricular" onclick="quick('+l.id+',\'Matriculado\')">🎓</button>'+
        '<button class="ib" title="Ver ficha" onclick="openFicha('+l.id+')">👁️</button>'+
      '</div></td></tr>';
  }).join('') || '<tr><td colspan="7" class="empty">No hay leads con estos filtros</td></tr>';
  var h=toggle+'<div class="toolbar">'+chips+'</div>';
  h+='<table><thead><tr><th>Lead</th><th>Ciclo</th><th>Nivel</th><th>Estado</th><th>Score</th><th>Campaña</th><th>Acciones</th></tr></thead><tbody>'+rows+'</tbody></table>';
  h+='<div class="small" style="margin-top:10px">'+arr.length+' leads · ordenados por score</div>';
  document.getElementById('view').innerHTML=h;
}
function setFiltro(e){FILTRO_ESTADO=e;renderLeads();}
function setLeadsMode(m){LEADSMODE=m;renderLeads();}

/* ---------- VISTA: Kanban (sub-vista de Leads) ---------- */
function kanbanHtml(){
  var arr=visibles();
  var cols=EMBUDO.map(function(e){
    var ls=arr.filter(function(l){return l.estado===e;});
    var cards=ls.sort(function(a,b){return b.score-a.score;}).map(function(l){
      return '<div class="kcard" draggable="true" style="border-left-color:'+COLOR[e]+'" ondragstart="dragStart(event,'+l.id+')" onclick="openFicha('+l.id+')">'+
        '<div class="kn">'+esc(nombreVis(l))+'</div>'+
        '<div class="km">'+esc(l.ciclo||'—')+' · <span class="scorepill">⭐'+l.score+'</span></div></div>';
    }).join('') || '<div class="small" style="padding:8px">—</div>';
    return '<div class="kcol" data-estado="'+esc(e)+'" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,\''+e.replace(/'/g,"")+'\')">'+
      '<div class="kh"><span style="color:'+COLOR[e]+'">'+esc(e)+'</span><span class="cnt">'+ls.length+'</span></div>'+cards+'</div>';
  }).join('');
  return '<div class="small" style="margin-bottom:10px">Arrastra una tarjeta entre columnas para mover el lead por el embudo 👇</div><div class="kan">'+cols+'</div>';
}
function dragStart(e,id){dragId=id;e.dataTransfer.effectAllowed='move';}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drop');}
function dragLeave(e){e.currentTarget.classList.remove('drop');}
function drop(e,estado){e.preventDefault();e.currentTarget.classList.remove('drop');
  var l=byId(dragId);if(l&&l.estado!==estado){l.estado=estado;recalcPri(l);toast('➡️ '+nombreVis(l)+' → '+estado,'ok');}
  renderLeads();}

/* ---------- VISTA: Correo ---------- */
function renderCorreo(){
  MAILS.forEach(function(m){m.leido=true;});actualizarBadge();
  var items=MAILS.map(function(m){
    var adj=m.adjuntos.map(function(a){return '<span class="attach">📎 '+esc(a)+'</span>';}).join(' ');
    return '<div class="mailitem'+(m.leido?'':' unread')+'" onclick="abrirMail('+m.id+')">'+
      '<div class="av">'+esc((m.paraNombre||'?').slice(0,1).toUpperCase())+'</div>'+
      '<div class="who">'+esc(m.paraNombre)+'</div>'+
      '<div class="subj"><b>'+esc(m.asunto)+'</b> <span>— '+esc(m.cuerpo.replace(/\n/g,' ').slice(0,60))+'…</span></div>'+
      '<div class="meta">'+(adj?adj:'')+' <span class="draftlabel">BORRADOR</span> '+esc(m.fecha)+'</div></div>';
  }).join('') || '<div class="empty">Sin borradores todavía. Ve a un lead → «Enviar dossier» y vuelve aquí. ✉️</div>';
  var h='<div class="mailbox"><div class="mailhead">✉️ Borradores de Gmail <span class="small" style="font-weight:600;margin-left:auto">'+MAILS.length+' borrador(es) · generados por las acciones del CRM</span></div>'+items+'</div>'+
    '<div class="small" style="margin-top:10px">En la herramienta real estos borradores se crean en tu Gmail con <code>GmailApp.createDraft</code>; aquí lo simulamos para enseñar el flujo completo.</div>';
  document.getElementById('view').innerHTML=h;
}
function abrirMail(id){
  var m=null;for(var i=0;i<MAILS.length;i++)if(MAILS[i].id===id)m=MAILS[i];if(!m)return;
  var adj=m.adjuntos.map(function(a){return '<span class="attach">📎 '+esc(a)+'</span>';}).join(' ');
  var h='<div class="mh"><div><h2>'+esc(m.asunto)+'</h2><div style="opacity:.85;font-size:13px;margin-top:3px">Para: '+esc(maskMail(m.para))+'</div></div><button class="x" onclick="closeFicha()">✕</button></div>'+
    '<div class="mb"><div style="margin-bottom:10px"><span class="draftlabel">BORRADOR</span> '+(adj||'')+'</div>'+
    '<div class="mailbody">'+esc(m.cuerpo)+'</div>'+
    '<div class="actbar"><button class="btn pri" onclick="toast(\'📨 (Demo) Correo enviado\',\'ok\');closeFicha()">📨 Enviar</button>'+
    '<button class="btn" onclick="closeFicha()">Cerrar</button></div></div>';
  document.getElementById('modal').innerHTML=h;document.getElementById('scrim').classList.add('on');
}

/* ---------- acciones ---------- */
function byId(id){for(var i=0;i<LEADS.length;i++)if(LEADS[i].id===id)return LEADS[i];return null;}
function recalcPri(l){l.prioridad=(l.estado==='Matriculado'||l.estado==='Solicitud - Reserva Plaza'||l.estado==='Interesado - Entrevista')?'Alta':l.estado==='Contactado'?'Media':l.estado==='Nuevo'?'Baja':'';}
function quick(id,estado){var l=byId(id);if(!l)return;l.estado=estado;recalcPri(l);
  toast((estado==='Matriculado'?'🎓 ':estado==='Contactado'?'📞 ':'📅 ')+nombreVis(l)+' → '+estado,'ok');render();}
function nuevoLead(){
  var nombre=prompt('Nombre del nuevo lead:');if(nombre===null)return;
  var nid=Math.max.apply(null,LEADS.map(function(l){return l.id;}))+1;
  LEADS.unshift({id:nid,nombre:nombre||'(sin nombre)',email:'',tel:'',ciclo:'',familia:'',familiaCorta:'',nivel:'',
    estado:'Nuevo',prioridad:'Media',canal:'Web orgánica',campana:'2026-2027',fecha:'hoy',fechaNum:99999999,colegio:'',motivo:'',obs:'',directa:false,score:34});
  toast('➕ Lead "'+(nombre||'nuevo')+'" creado en la campaña 2026-2027','ok');render();
}

/* ---------- Ficha (modal) ---------- */
function openFicha(id){
  var l=byId(id);if(!l)return;
  var kv=function(k,v){return '<div class="kv"><div class="k">'+k+'</div><div class="v">'+esc(v||'—')+'</div></div>';};
  var dossierChips=DOSSIERES.map(function(d){var on=d.familia&&d.familia===l.familia;
    return '<span class="chip'+(on?' on':'')+'" data-d="'+d.id+'" onclick="this.classList.toggle(\'on\')">📄 '+esc(d.nombre)+'</span>';}).join('');
  var motivoOpts=MOTIVOS.map(function(m){return '<option>'+esc(m)+'</option>';}).join('');
  var h='<div class="mh"><div><h2>'+esc(nombreVis(l))+'</h2><div style="opacity:.85;font-size:13px;margin-top:2px">'+esc(l.ciclo||'Sin ciclo definido')+' · Campaña '+esc(l.campana)+'</div></div>'+
    '<button class="x" onclick="closeFicha()">✕</button></div><div class="mb">';
  h+='<div style="margin-bottom:14px">'+badge(l.estado)+' &nbsp; <span class="scorepill">⭐ Score '+l.score+'</span> &nbsp; <span class="tag">'+esc(l.prioridad||'—')+'</span></div>';
  h+='<div class="kvs">'+kv('Email',maskMail(l.email))+kv('Teléfono',maskTel(l.tel))+
    kv('Nivel',l.nivel)+kv('Familia',l.familia)+kv('Canal',l.canal)+kv('Centro procedencia',l.colegio)+
    kv('Fecha de entrada',l.fecha)+kv('Motivo',l.motivo)+'</div>';
  h+='<div class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:6px">📝 Observaciones / seguimiento</div>';
  h+='<div class="obs">'+(l.obs?esc(l.obs):'<span class="small">Sin observaciones registradas todavía.</span>')+'</div>';
  h+='<div class="actbar">'+
    '<button class="btn" onclick="fic(\'contacto\','+l.id+')">📞 Registrar contacto</button>'+
    '<button class="btn" onclick="fic(\'entrevista\','+l.id+')">📅 Agendar entrevista</button>'+
    '<button class="btn" onclick="fic(\'dossier\','+l.id+')">📄 Enviar dossier</button>'+
    '<button class="btn ok" onclick="setEstado('+l.id+',\'Matriculado\')">🎓 Matricular</button>'+
    '<button class="btn dng" onclick="fic(\'descartar\','+l.id+')">❌ Descartar</button>'+'</div>';
  // paneles inline
  h+='<div class="inlinepanel" id="p-contacto"><textarea id="notaC" placeholder="Anota la llamada / el correo…"></textarea><button class="btn pri" onclick="doContacto('+l.id+')">Guardar y marcar Contactado</button></div>';
  h+='<div class="inlinepanel" id="p-entrevista"><label>Fecha:</label><input type="date" id="feE"><button class="btn pri" onclick="doEntrevista('+l.id+')">📅 Agendar (Calendar)</button></div>';
  h+='<div class="inlinepanel" id="p-dossier"><div style="width:100%;font-size:12px;color:var(--muted);margin-bottom:2px">Elige uno o más dossieres:</div>'+dossierChips+'<button class="btn pri" onclick="doDossier('+l.id+')">✉️ Crear borrador</button></div>';
  h+='<div class="inlinepanel" id="p-descartar"><label>Motivo:</label><select id="moD">'+motivoOpts+'</select><button class="btn dng" onclick="doDescartar('+l.id+')">Descartar</button></div>';
  h+='</div>';
  document.getElementById('modal').innerHTML=h;
  document.getElementById('scrim').classList.add('on');
}
function closeFicha(){document.getElementById('scrim').classList.remove('on');}
function fic(panel,id){['contacto','entrevista','dossier','descartar'].forEach(function(p){
  var el=document.getElementById('p-'+p);if(!el)return;
  if(p===panel) el.classList.toggle('on'); else el.classList.remove('on');});}
function setEstado(id,estado){var l=byId(id);l.estado=estado;recalcPri(l);toast('🎓 ¡'+nombreVis(l)+' matriculado!','ok');closeFicha();render();}
function doContacto(id){var l=byId(id);var n=document.getElementById('notaC').value;l.estado='Contactado';recalcPri(l);
  if(n)l.obs=(l.obs?l.obs+' | ':'')+'Hoy: '+n;toast('📞 '+nombreVis(l)+' marcado como Contactado','ok');closeFicha();render();}
function doEntrevista(id){var l=byId(id);var f=document.getElementById('feE').value;if(!f){toast('Elige una fecha','dng');return;}
  l.estado='Interesado - Entrevista';recalcPri(l);
  crearMail(l,'Confirmación de entrevista — FP Retamar',
    'Hola '+(primerNombre(l)||'')+',\n\nTe confirmamos la entrevista de admisión el '+f+' a las 17:00 en Retamar (C/ Pajares, Madrid).\n\nUn saludo,\nAdmisiones FP — Retamar',[]);
  l.obs=(l.obs?l.obs+' | ':'')+'Entrevista agendada '+f;
  toast('📅 Entrevista en Calendar + email de confirmación (pestaña «Correo»)','ok');closeFicha();render();}
function doDossier(id){var l=byId(id);var sel=[].slice.call(document.querySelectorAll('#p-dossier .chip.on'));
  if(!sel.length){toast('Marca al menos un dossier','dng');return;}
  var noms=sel.map(function(c){return c.textContent.replace('📄','').trim();});
  var cuerpo='Hola '+(primerNombre(l)||'')+',\n\nGracias por tu interés en la Formación Profesional de Retamar. Te adjunto la información que pediste:\n\n'+
    noms.map(function(n){return '• '+n;}).join('\n')+'\n\nCualquier duda, quedo a tu disposición.\n\nUn saludo,\nAdmisiones FP — Retamar';
  crearMail(l,'Dossier informativo — FP Retamar',cuerpo,noms.map(function(n){return n+'.pdf';}));
  l.obs=(l.obs?l.obs+' | ':'')+'Enviado dossier: '+noms.join(', ');
  toast('✉️ Borrador creado en Gmail → míralo en la pestaña «Correo»','ok');closeFicha();render();}
function doDescartar(id){var l=byId(id);var m=document.getElementById('moD').value;l.estado='Descartado';l.motivo=m;l.prioridad='';
  toast('❌ '+nombreVis(l)+' descartado ('+m+')','dng');closeFicha();render();}

/* ---------- router ---------- */
function render(){
  document.getElementById('crumb').textContent={dashboard:'Dashboard',leads:'CRM · Leads',correo:'Correo (borradores)'}[VIEW];
  if(VIEW==='dashboard')renderDashboard();
  else if(VIEW==='leads')renderLeads();
  else if(VIEW==='correo')renderCorreo();
}
document.getElementById('nav').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('on');});
  b.classList.add('on');VIEW=b.dataset.v;render();
});
document.getElementById('q').addEventListener('input',function(){Q=this.value;render();});
document.getElementById('camp').addEventListener('change',function(){CAMP=this.value;render();});
document.getElementById('presBtn').addEventListener('click',function(){PRES=!PRES;this.classList.toggle('on',PRES);render();});
document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this)closeFicha();});
document.getElementById('presBtn').classList.toggle('on',PRES);
seedCorreo();
render();
</script>
</body>
</html>
